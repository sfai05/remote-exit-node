---
- name: Provision remote exit node
  hosts: exit_nodes
  become: true
  roles:
    - role: baseline
      tags: [baseline]
    - role: ssh
      tags: [ssh]
    # Before the tunnels: it is what switches IP forwarding on.
    - role: lan_guard
      tags: [lan_guard]
    - role: host_firewall
      tags: [host_firewall]
    - role: tailscale
      tags: [tailscale]
      when: enable_tailscale | bool
    - role: wireguard
      tags: [wireguard]
      when: enable_wireguard | bool
    - role: dns
      tags: [dns]
      when: enable_dns | bool and enable_wireguard | bool
    - role: duckdns
      tags: [duckdns]
      when: enable_duckdns | bool
    - role: doctor
      tags: [doctor]
    - role: monitoring
      tags: [monitoring]
      when: enable_monitoring | bool
    - role: manual
      tags: [manual]

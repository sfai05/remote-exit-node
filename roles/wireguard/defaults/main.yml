---
wireguard_mtu: "" # empty = WireGuard default; set e.g. 1380 if the path has PPPoE/odd MTU
wireguard_keepalive: 25

# Client configs (they contain private keys) are written here on the control node.
wireguard_artifacts_dir: "{{ artifacts_dir }}"
wireguard_qr_codes: true # needs qrencode on the control node; skipped if missing

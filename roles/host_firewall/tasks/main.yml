---
- name: Install iptables tools
  ansible.builtin.apt:
    name: iptables
    state: present

- name: Install host firewall integration script
  ansible.builtin.template:
    src: exit-node-host-firewall.j2
    dest: /usr/local/sbin/exit-node-host-firewall
    mode: "0755"
  notify: Apply host firewall

- name: Install host firewall unit
  ansible.builtin.template:
    src: exit-node-host-firewall.service.j2
    dest: /etc/systemd/system/exit-node-host-firewall.service
    mode: "0644"
  notify: Apply host firewall

- name: Enable host firewall integration
  ansible.builtin.systemd_service:
    name: exit-node-host-firewall.service
    enabled: true
    state: started
    daemon_reload: true

# The tunnel roles that follow need these rules in place.
- name: Apply host firewall changes
  ansible.builtin.meta: flush_handlers

---
# try-: no-op when socket activation hasn't started sshd yet (it reads the new config then).
# The systemd module has no try-reload-or-restart.
- name: Reload sshd # noqa: command-instead-of-module
  ansible.builtin.command: systemctl try-reload-or-restart ssh.service
  changed_when: true

- name: Restart sshguard
  ansible.builtin.systemd_service:
    name: sshguard
    state: restarted

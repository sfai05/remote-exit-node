---
- name: Validate DuckDNS settings
  ansible.builtin.assert:
    that:
      - duckdns_domain is match('^[a-z0-9-]+$')
      - duckdns_token | length > 0
    fail_msg: "Set duckdns_domain (subdomain only, no .duckdns.org) and vault_duckdns_token."

- name: Write DuckDNS credentials
  ansible.builtin.copy:
    dest: /etc/duckdns.env
    content: |
      DUCKDNS_DOMAIN={{ duckdns_domain }}
      DUCKDNS_TOKEN={{ duckdns_token }}
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Run DuckDNS update

- name: Install DuckDNS update script
  ansible.builtin.copy:
    src: duckdns-update
    dest: /usr/local/bin/duckdns-update
    mode: "0755"
  notify: Run DuckDNS update

- name: Install DuckDNS systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - duckdns-update.service
    - duckdns-update.timer
  notify: Run DuckDNS update

- name: Enable DuckDNS timer
  ansible.builtin.systemd_service:
    name: duckdns-update.timer
    enabled: true
    state: started
    daemon_reload: true

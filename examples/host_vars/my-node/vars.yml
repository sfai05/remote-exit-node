---
# Optional: your own settings for this node (host_vars/<node>/vars.yml). They override the
# generated setup.yml, and scripts/setup.sh never touches this file. See group_vars/all.yml
# and roles/*/defaults/main.yml for everything you can set.

ssh_password_auth: true

wireguard_peer_options:
  # Always-on router client: server keepalives, and alert when its tunnel is down.
  unifi: { server_keepalive: 25, expect_connected: true }
  # If a client rejects IPv6 addresses:
  # unifi: { allowed_ips: 0.0.0.0/0 }

---
# Reference: what scripts/setup.sh keeps in host_vars/<node>/vault.yml, always encrypted.
# Don't write it by hand: values come from the env file (or setup.sh's hidden prompts) and
# WireGuard keys are generated for every name in WG_PEERS. To look inside:
#   ansible-vault view host_vars/<node>/vault.yml

vault_become_pass: !unsafe 'sudo password of the login user; empty with passwordless sudo'
vault_tailscale_authkey: !unsafe 'tskey-auth-...'
vault_duckdns_token: !unsafe 'duckdns token'
vault_monitoring_heartbeat_url: !unsafe 'https://hc-ping.com/<uuid>'
vault_wireguard_server:
  private_key: '<generated>'
  public_key: '<generated>'
vault_wireguard_peers:
  unifi:
    private_key: '<generated>'
    public_key: '<generated>'
  phone:
    private_key: '<generated>'
    public_key: '<generated>'

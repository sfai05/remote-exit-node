---
# Copy to host_vars/<inventory-name>/vault.yml, fill in, then ENCRYPT:
#   ansible-vault encrypt host_vars/<inventory-name>/vault.yml
# Generate the WireGuard block with: scripts/wg-keys.sh unifi phone

vault_become_pass: CHANGEME # sudo password of the ansible_user on the node

# https://login.tailscale.com/admin/settings/keys
# One-off (not reusable), non-ephemeral. Only used for the first join.
vault_tailscale_authkey: CHANGEME

# https://www.duckdns.org (shown after login)
vault_duckdns_token: CHANGEME

# Optional, e.g. a https://hc-ping.com/<uuid> URL. Leave empty to disable.
vault_monitoring_heartbeat_url: ""

vault_wireguard_server:
  private_key: CHANGEME
  public_key: CHANGEME

vault_wireguard_peers:
  unifi:
    private_key: CHANGEME
    public_key: CHANGEME
  phone:
    private_key: CHANGEME
    public_key: CHANGEME

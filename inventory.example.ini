# Copy to inventory.ini (gitignored) and edit.
# Before shipping the box, ansible_host is its LAN IP; afterwards use its Tailscale
# name or 100.x address so you can keep managing it remotely.
[exit_nodes]
my-node ansible_host=192.168.1.50 ansible_user=admin ansible_ssh_private_key_file=~/.ssh/exit-node_ed25519
